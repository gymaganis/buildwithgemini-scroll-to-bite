<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ScrollToBite — Main Character Eats 💅</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
<style>
  :root {
    --bg-dark: #070913;
    --panel-bg: rgba(13, 17, 30, 0.85);
    --card-bg: rgba(22, 28, 48, 0.78);
    --card-hover: rgba(30, 39, 66, 0.98);
    --border-color: rgba(255, 255, 255, 0.12);
    --border-glow: rgba(255, 71, 87, 0.38);
    --accent-coral: #ff4757;
    --accent-rose: #ff6b81;
    --accent-amber: #ffa502;
    --accent-emerald: #2ed573;
    --accent-gradient: linear-gradient(135deg, #ff4757 0%, #ff6b81 50%, #ffa502 100%);
    --text-primary: #f8fafc;
    --text-secondary: #94a3b8;
    --text-muted: #64748b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif;
    background: var(--bg-dark);
    background-image: 
      radial-gradient(circle at 50% 0%, rgba(255, 71, 87, 0.22) 0%, transparent 60%),
      radial-gradient(circle at 100% 100%, rgba(255, 165, 2, 0.12) 0%, transparent 50%),
      radial-gradient(circle at 0% 50%, rgba(46, 213, 115, 0.08) 0%, transparent 45%);
    color: var(--text-primary);
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  /* --- Gen Z Header --- */
  header {
    background: var(--panel-bg);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border-bottom: 1px solid var(--border-color);
    padding: 0.85rem 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    z-index: 100;
  }

  .logo-container {
    display: flex;
    align-items: center;
    gap: 0.85rem;
  }

  .logo-icon {
    font-size: 2.1rem;
    filter: drop-shadow(0 0 16px rgba(255, 71, 87, 0.6));
    animation: float 3s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-3px); }
  }

  .logo-text {
    font-size: 1.6rem;
    font-weight: 900;
    letter-spacing: -0.02em;
    background: var(--accent-gradient);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .logo-sub {
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 1rem;
  }

  .status-badge {
    display: flex;
    align-items: center;
    gap: 0.55rem;
    background: rgba(46, 213, 115, 0.12);
    border: 1px solid rgba(46, 213, 115, 0.3);
    padding: 0.4rem 0.95rem;
    border-radius: 20px;
    font-size: 0.82rem;
    font-weight: 800;
    color: #2ed573;
    letter-spacing: 0.02em;
  }

  .pulse-dot {
    width: 8px;
    height: 8px;
    background-color: #2ed573;
    border-radius: 50%;
    box-shadow: 0 0 10px #2ed573;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(46, 213, 115, 0.7); }
    70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(46, 213, 115, 0); }
    100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(46, 213, 115, 0); }
  }

  /* --- Quick Interactive Bar --- */
  .quick-bar {
    display: flex;
    align-items: center;
    gap: 0.65rem;
    padding: 0.75rem 2rem;
    background: rgba(7, 9, 19, 0.65);
    border-bottom: 1px solid var(--border-color);
    overflow-x: auto;
    scrollbar-width: none;
  }

  .quick-bar::-webkit-scrollbar { display: none; }

  .quick-pill {
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid var(--border-color);
    border-radius: 20px;
    padding: 0.4rem 0.95rem;
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--text-secondary);
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s ease;
  }

  .quick-pill:hover {
    background: rgba(255, 71, 87, 0.18);
    border-color: var(--accent-coral);
    color: #ffffff;
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(255, 71, 87, 0.25);
  }

  /* --- Main Layout --- */
  main {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem 2rem;
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
  }

  .chat-container {
    max-width: 900px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
  }

  .msg {
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
    animation: slideFadeIn 0.35s ease-out forwards;
  }

  @keyframes slideFadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg.user { align-items: flex-end; }
  .msg.agent { align-items: flex-start; }

  .avatar-label {
    font-size: 0.78rem;
    font-weight: 800;
    color: var(--text-muted);
    margin-left: 0.5rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    display: flex;
    align-items: center;
    gap: 0.35rem;
  }

  .msg.user .avatar-label { margin-right: 0.5rem; }

  .bubble {
    display: inline-block;
    padding: 1.15rem 1.45rem;
    border-radius: 22px;
    max-width: 100%;
    line-height: 1.55;
    font-size: 0.98rem;
    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.25);
  }

  .msg.user .bubble {
    background: var(--accent-gradient);
    color: #ffffff;
    font-weight: 600;
    border-bottom-right-radius: 4px;
  }

  .msg.agent .bubble {
    background: var(--panel-bg);
    border: 1px solid var(--border-color);
    color: var(--text-primary);
    border-bottom-left-radius: 4px;
    width: 100%;
    backdrop-filter: blur(16px);
  }

  .bubble.rich {
    background: transparent;
    border: none;
    padding: 0;
    box-shadow: none;
  }

  /* --- Bottom Input Form --- */
  form {
    display: flex;
    gap: 0.75rem;
    padding: 1.1rem 1.5rem;
    border-top: 1px solid var(--border-color);
    background: var(--panel-bg);
    backdrop-filter: blur(24px);
    max-width: 900px;
    width: 100%;
    margin: 0 auto;
    border-radius: 24px 24px 0 0;
    box-shadow: 0 -8px 32px rgba(0, 0, 0, 0.4);
  }

  input {
    flex: 1;
    padding: 0.95rem 1.35rem;
    border: 1px solid var(--border-color);
    border-radius: 16px;
    font-size: 0.98rem;
    font-family: inherit;
    background: rgba(7, 9, 19, 0.85);
    color: #ffffff;
    outline: none;
    transition: all 0.2s ease;
  }

  input:focus {
    border-color: var(--accent-coral);
    box-shadow: 0 0 0 3px rgba(255, 71, 87, 0.25);
  }

  button {
    padding: 0.95rem 1.85rem;
    border: none;
    border-radius: 16px;
    background: var(--accent-gradient);
    color: #fff;
    font-weight: 800;
    font-size: 0.98rem;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 4px 20px rgba(255, 71, 87, 0.4);
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }

  button:hover {
    transform: translateY(-2px) scale(1.02);
    box-shadow: 0 6px 28px rgba(255, 71, 87, 0.55);
  }

  /* --- A2UI Card & Component Styles --- */
  .a2card {
    border: 1px solid var(--border-color);
    border-radius: 22px;
    padding: 1.45rem;
    background: var(--card-bg);
    backdrop-filter: blur(20px);
    box-shadow: 0 10px 36px rgba(0, 0, 0, 0.4);
    max-width: 100%;
    color: var(--text-primary);
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    border-left: 4px solid var(--accent-coral);
    position: relative;
    overflow: hidden;
  }

  .a2card::before {
    content: '';
    position: absolute;
    top: 0; right: 0;
    width: 120px; height: 120px;
    background: radial-gradient(circle, rgba(255, 71, 87, 0.12) 0%, transparent 70%);
    pointer-events: none;
  }

  .a2card:hover {
    background: var(--card-hover);
    border-color: var(--border-glow);
    transform: translateY(-3px);
    box-shadow: 0 14px 42px rgba(255, 71, 87, 0.2);
  }

  .a2card + .a2card, .a2col > .a2card { margin-top: 0.95rem; }
  .a2col { display: flex; flex-direction: column; gap: 0.75rem; }
  .a2row { display: flex; flex-direction: row; gap: 0.95rem; align-items: center; flex-wrap: wrap; }
  .a2row.between { justify-content: space-between; }

  .a2text { margin: 0; line-height: 1.5; color: var(--text-primary); }
  .a2text.a2-h1 { font-size: 1.6rem; font-weight: 900; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .a2text.a2-h2 { font-size: 1.35rem; font-weight: 800; color: #ffffff; letter-spacing: -0.01em; }
  .a2text.a2-h3 { font-size: 1.2rem; font-weight: 800; color: #ffffff; }
  .a2text.a2-body { font-size: 0.98rem; color: #cbd5e1; }
  .a2text.a2-caption { 
    font-size: 0.85rem; 
    color: var(--accent-amber); 
    font-weight: 700; 
    background: rgba(255, 165, 2, 0.12); 
    border: 1px solid rgba(255, 165, 2, 0.25);
    padding: 0.3rem 0.7rem; 
    border-radius: 10px; 
    display: inline-block; 
    width: fit-content; 
  }

  .a2divider { border: none; border-top: 1px solid var(--border-color); margin: 0.75rem 0; width: 100%; }

  /* Full aspect photo container */
  .a2img-container {
    overflow: hidden;
    border-radius: 16px;
    margin: 0.75rem 0;
    max-height: 420px;
    position: relative;
    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.45);
    background: rgba(0, 0, 0, 0.5);
    display: flex;
    justify-content: center;
    align-items: center;
    border: 1px solid var(--border-color);
  }

  .a2img {
    max-width: 100%;
    max-height: 400px;
    width: auto;
    height: auto;
    object-fit: contain;
    display: block;
    border-radius: 12px;
    transition: transform 0.5s ease;
  }

  .a2img-container:hover .a2img {
    transform: scale(1.03);
  }

  /* Free Google Maps Bar - Exact Restaurant + Location Query */
  .map-action-bar {
    display: flex;
    align-items: center;
    gap: 0.65rem;
    margin-top: 0.8rem;
    flex-wrap: wrap;
  }

  .map-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.45rem;
    background: rgba(46, 213, 115, 0.14);
    border: 1px solid rgba(46, 213, 115, 0.35);
    color: #2ed573;
    padding: 0.45rem 0.95rem;
    border-radius: 14px;
    font-size: 0.85rem;
    font-weight: 800;
    text-decoration: none;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .map-btn:hover {
    background: rgba(46, 213, 115, 0.28);
    border-color: #2ed573;
    transform: translateY(-1px);
    box-shadow: 0 4px 16px rgba(46, 213, 115, 0.35);
  }

  .map-embed-container {
    width: 100%;
    margin-top: 0.75rem;
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid var(--border-color);
    box-shadow: 0 6px 20px rgba(0,0,0,0.4);
    display: none;
  }

  .map-embed-container.active {
    display: block;
    animation: slideFadeIn 0.3s ease-out;
  }
</style>
</head>
<body>

<header>
  <div class="logo-container">
    <div class="logo-icon">🔥</div>
    <div>
      <div class="logo-text">ScrollToBite</div>
      <div class="logo-sub">Main Character Eats 💅 • Viral Food Finder</div>
    </div>
  </div>
  <div class="header-actions">
    <div class="status-badge">
      <div class="pulse-dot"></div>
      <span>Locked In • Vertex AI</span>
    </div>
  </div>
</header>

<div class="quick-bar">
  <div class="quick-pill" onclick="sendQuick('Show my saved wishlist spots for Bay Area')">📍 Bay Area Slaps</div>
  <div class="quick-pill" onclick="sendQuick('Save this link: https://www.tiktok.com/@bayareafoodz/video/7410129571867086123')">🌮 Save Birria Taco Reel</div>
  <div class="quick-pill" onclick="sendQuick('Save this link: https://www.instagram.com/p/DawZsF2p36I/')">🍲 Save Hotpot IG Reel</div>
  <div class="quick-pill" onclick="sendQuick('Recommend viral food spots in San Jose')">🔥 San Jose Viral Eats</div>
  <div class="quick-pill" onclick="sendQuick('Recommend top viral pizza in New York')">🍕 NYC Viral Slice</div>
  <div class="quick-pill" onclick="sendQuick('What food spots do I have saved in NYC?')">🌆 NYC Wishlist</div>
</div>

<main>
  <div class="chat-container" id="log"></div>
</main>

<form id="form">
  <input type="text" id="input" placeholder="Drop a TikTok/IG link or ask 'Show saved spots in San Jose'..." autocomplete="off" />
  <button type="submit">
    <span class="material-symbols-outlined" style="font-size: 18px;">send</span>
    <span>Send</span>
  </button>
</form>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function boundStr(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (typeof v === "object" && v.literalString != null) return String(v.literalString);
  return String(v);
}

function iconName(raw) {
  const s = String(raw || "").toLowerCase();
  if (s.includes("star") || s.includes("favorite")) return "star";
  if (s.includes("place") || s.includes("location") || s.includes("pin")) return "location_on";
  if (s.includes("restaurant") || s.includes("food") || s.includes("dining")) return "restaurant";
  if (s.includes("share") || s.includes("link")) return "link";
  return "restaurant";
}

function childIds(spec) {
  if (!spec) return [];
  if (typeof spec.child === "string") return [spec.child];
  if (spec.children && Array.isArray(spec.children.explicitList)) return spec.children.explicitList.filter(x => typeof x === "string");
  return [];
}

// Google Maps Search Generator: Exact Restaurant Name + Location
function createGoogleMapBar(queryStr) {
  const bar = el("div", "map-action-bar");
  
  // Free Google Maps Direct Search
  const link = el("a", "map-btn");
  link.href = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(queryStr)}`;
  link.target = "_blank";
  link.innerHTML = `<span class="material-symbols-outlined" style="font-size:16px;">map</span><span>Google Maps: "${queryStr}"</span>`;
  bar.appendChild(link);

  // Free Google Maps Embed Toggle
  const toggleBtn = el("button", "map-btn");
  toggleBtn.type = "button";
  toggleBtn.style.background = "rgba(255, 165, 2, 0.12)";
  toggleBtn.style.borderColor = "rgba(255, 165, 2, 0.35)";
  toggleBtn.style.color = "#ffa502";
  toggleBtn.innerHTML = `<span class="material-symbols-outlined" style="font-size:16px;">explore</span><span>Toggle Map Embed</span>`;

  const mapContainer = el("div", "map-embed-container");
  const iframe = el("iframe");
  iframe.src = `https://maps.google.com/maps?q=${encodeURIComponent(queryStr)}&output=embed`;
  iframe.width = "100%";
  iframe.height = "220";
  iframe.style.border = "0";
  iframe.loading = "lazy";
  mapContainer.appendChild(iframe);

  toggleBtn.addEventListener("click", () => {
    mapContainer.classList.toggle("active");
  });

  const wrapper = el("div");
  wrapper.appendChild(bar);
  wrapper.appendChild(mapContainer);
  return wrapper;
}

// Helper to extract exact restaurant name & location from card text specs
function extractSpotDetails(cardSpec, comps) {
  let restName = "";
  let location = "";

  function walk(id) {
    if (!id || !comps[id]) return;
    const spec = comps[id];
    const type = Object.keys(spec)[0];
    const props = spec[type] || {};

    if (type === "Text") {
      const txt = boundStr(props.text);
      if ((props.usageHint === "h2" || props.usageHint === "h3") && !restName) {
        restName = txt.replace(/^[^\w\s]+/, "").trim(); // strip leading emoji
      } else if (!restName && txt && !txt.toLowerCase().includes("location:") && !txt.toLowerCase().includes("status:") && !txt.toLowerCase().includes("dish:") && !txt.toLowerCase().includes("saved")) {
        restName = txt.replace(/^[^\w\s]+/, "").trim();
      }

      if (txt.toLowerCase().includes("location:")) {
        location = txt.replace(/^location:/i, "").trim();
      }
    }

    for (const cid of childIds(props)) walk(cid);
  }

  walk(cardSpec.child);
  return { restName, location };
}

function buildNode(id, comps, visited) {
  if (!id || visited.has(id) || !comps[id]) return null;
  visited.add(id);
  const spec = comps[id];
  const type = Object.keys(spec)[0];
  const props = spec[type] || {};

  switch (type) {
    case "Card": {
      const card = el("div", "a2card");
      const child = buildNode(props.child, comps, visited);
      if (child) card.appendChild(child);

      // Extract spot name & location to append exact restaurant Google Maps bar
      const details = extractSpotDetails(props, comps);
      let queryStr = "";
      if (details.restName && details.location) {
        queryStr = `${details.restName}, ${details.location}`;
      } else if (details.restName) {
        queryStr = details.restName;
      } else if (details.location) {
        queryStr = details.location;
      }

      if (queryStr) {
        card.appendChild(createGoogleMapBar(queryStr));
      }

      return card;
    }
    case "Column": {
      const col = el("div", "a2col");
      for (const cid of childIds(props)) {
        const c = buildNode(cid, comps, visited);
        if (c) col.appendChild(c);
      }
      return col;
    }
    case "Row": {
      const row = el("div", "a2row");
      for (const cid of childIds(props)) {
        const c = buildNode(cid, comps, visited);
        if (c) row.appendChild(c);
      }
      return row;
    }
    case "Text": {
      const t = el("p", "a2text");
      const hint = String(props.usageHint || "body").toLowerCase();
      if (["h1", "h2", "h3", "h4", "h5", "h6"].includes(hint)) t.classList.add("a2-" + hint);
      else if (hint === "caption") t.classList.add("a2-caption");
      else t.classList.add("a2-body");
      
      const txtVal = boundStr(props.text);
      t.textContent = txtVal;
      return t;
    }
    case "Divider":
      return el("hr", "a2divider");
    case "Image": {
      const src = boundStr(props.url || props.src);
      if (!/^https?:\/\//i.test(src)) return null;
      const wrap = el("div", "a2img-container");
      const img = el("img", "a2img");
      img.src = src;
      img.alt = boundStr(props.alt) || "Food spot photo";
      wrap.appendChild(img);
      return wrap;
    }
    case "Icon": {
      const s = el("span", "material-symbols-outlined");
      s.textContent = iconName(boundStr(props.name) || props.name);
      return s;
    }
    default:
      return null;
  }
}

function renderSurface(messages, container) {
  const comps = {};
  const roots = [];
  for (let m of messages) {
    if (m && m.data && (m.data.beginRendering || m.data.surfaceUpdate)) m = m.data;
    if (m.beginRendering && typeof m.beginRendering.root === "string") roots.push(m.beginRendering.root);
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.id && c.component) comps[c.id] = c.component;
  }
  let rootIds = roots.filter(r => comps[r]);
  if (rootIds.length === 0) {
    const referenced = new Set();
    for (const id in comps) { const spec = comps[id]; childIds(spec[Object.keys(spec)[0]] || {}).forEach(c => referenced.add(c)); }
    rootIds = Object.keys(comps).filter(id => !referenced.has(id));
  }
  let drew = false;
  for (const rid of rootIds) { const node = buildNode(rid, comps, new Set()); if (node) { container.appendChild(node); drew = true; } }
  return drew;
}

function flattenText(messages) {
  const out = [];
  for (let m of messages) {
    if (m && m.data && (m.data.beginRendering || m.data.surfaceUpdate)) m = m.data;
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.component && c.component.Text) out.push(boundStr(c.component.Text.text));
  }
  return out.join("\n").trim();
}

function renderReply(b, parts) {
  b.textContent = "";
  const texts = parts.filter(p => p && (p.kind === "text" || (!p.kind && p.text))).map(p => p.text || "");
  const a2ui = parts.filter(p => p && p.kind === "a2ui" && p.data).map(p => p.data);

  const textStr = texts.join("\n").trim();
  if (textStr) b.appendChild(el("div", null, textStr));

  if (a2ui.length) {
    b.classList.add("rich");
    if (!renderSurface(a2ui, b)) b.appendChild(el("div", null, flattenText(a2ui) || "(no card content)"));
  }
}

function appendUserMsg(text) {
  const wrap = el("div", "msg user");
  wrap.appendChild(el("div", "avatar-label", "YOU"));
  const b = el("div", "bubble", text);
  wrap.appendChild(b);
  log.appendChild(wrap);
  log.scrollTop = log.scrollHeight;
}

function appendAgentBubble() {
  const wrap = el("div", "msg agent");
  wrap.appendChild(el("div", "avatar-label", "🤖 SCROLLTOBITE CONCIERGE"));
  const b = el("div", "bubble", "Thinking...");
  wrap.appendChild(b);
  log.appendChild(wrap);
  log.scrollTop = log.scrollHeight;
  return b;
}

async function sendMessage(text) {
  if (!text.trim()) return;
  appendUserMsg(text);
  const bubble = appendAgentBubble();

  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text }),
    });
    if (!res.ok) throw new Error("Server returned HTTP " + res.status);
    const data = await res.json();
    renderReply(bubble, data.parts || []);
  } catch (err) {
    bubble.textContent = "Error: " + err.message;
  }
  log.scrollTop = log.scrollHeight;
}

function sendQuick(txt) {
  input.value = txt;
  form.dispatchEvent(new Event("submit"));
}

form.addEventListener("submit", (e) => {
  e.preventDefault();
  const v = input.value;
  input.value = "";
  sendMessage(v);
});

// Welcome message on launch
window.addEventListener("DOMContentLoaded", () => {
  const welcomeBubble = appendAgentBubble();
  welcomeBubble.innerHTML = "<strong>Yo Foodie! 👋 Welcome to ScrollToBite 💅</strong><br><br>Drop a TikTok or IG reel link and I'll lock in the exact restaurant details, high-res photos, and Google Maps pin. No cap!";
});
</script>
