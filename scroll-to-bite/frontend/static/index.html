<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ScrollToBite — Viral Food Concierge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
<style>
  :root {
    --bg-dark: #070a12;
    --panel-bg: rgba(15, 23, 42, 0.75);
    --card-bg: rgba(30, 41, 59, 0.65);
    --card-hover: rgba(30, 41, 59, 0.9);
    --border-color: rgba(255, 255, 255, 0.08);
    --border-glow: rgba(255, 71, 87, 0.3);
    --accent-coral: #ff4757;
    --accent-amber: #ffa502;
    --accent-emerald: #2ed573;
    --accent-gradient: linear-gradient(135deg, #ff4757 0%, #ff6b81 50%, #ffa502 100%);
    --text-primary: #f8fafc;
    --text-secondary: #94a3b8;
    --text-muted: #64748b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif;
    background: var(--bg-dark);
    background-image: 
      radial-gradient(circle at 50% 0%, rgba(255, 71, 87, 0.15) 0%, transparent 60%),
      radial-gradient(circle at 100% 100%, rgba(255, 165, 2, 0.08) 0%, transparent 50%);
    color: var(--text-primary);
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  header {
    background: var(--panel-bg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border-color);
    padding: 0.9rem 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    z-index: 100;
  }

  .logo-container {
    display: flex;
    align-items: center;
    gap: 0.85rem;
  }

  .logo-icon {
    font-size: 1.8rem;
    filter: drop-shadow(0 0 12px rgba(255, 71, 87, 0.5));
    animation: float 3s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-3px); }
  }

  .logo-text {
    font-size: 1.45rem;
    font-weight: 900;
    letter-spacing: -0.02em;
    background: var(--accent-gradient);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .status-badge {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    background: rgba(46, 213, 115, 0.1);
    border: 1px solid rgba(46, 213, 115, 0.25);
    padding: 0.35rem 0.85rem;
    border-radius: 20px;
    font-size: 0.78rem;
    font-weight: 700;
    color: #2ed573;
    letter-spacing: 0.03em;
  }

  .pulse-dot {
    width: 8px;
    height: 8px;
    background-color: #2ed573;
    border-radius: 50%;
    box-shadow: 0 0 10px #2ed573;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(46, 213, 115, 0.7); }
    70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(46, 213, 115, 0); }
    100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(46, 213, 115, 0); }
  }

  .quick-pills {
    display: flex;
    gap: 0.6rem;
    overflow-x: auto;
    padding: 0.85rem 1.5rem;
    background: rgba(10, 15, 26, 0.6);
    border-bottom: 1px solid var(--border-color);
    scrollbar-width: none;
  }
  .quick-pills::-webkit-scrollbar { display: none; }

  .pill {
    background: rgba(30, 41, 59, 0.5);
    color: var(--text-primary);
    border: 1px solid rgba(255, 255, 255, 0.1);
    padding: 0.45rem 1rem;
    border-radius: 30px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }

  .pill:hover {
    background: rgba(255, 71, 87, 0.15);
    border-color: var(--accent-coral);
    color: var(--accent-coral);
    transform: translateY(-2px);
    box-shadow: 0 4px 16px rgba(255, 71, 87, 0.2);
  }

  #log {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem;
    max-width: 880px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
  }

  .msg {
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
    animation: slideFadeIn 0.3s ease-out forwards;
  }

  @keyframes slideFadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg.user { align-items: flex-end; }
  .msg.agent { align-items: flex-start; }

  .avatar-label {
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--text-muted);
    margin-left: 0.5rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .msg.user .avatar-label { margin-right: 0.5rem; }

  .bubble {
    display: inline-block;
    padding: 0.95rem 1.35rem;
    border-radius: 20px;
    background: var(--panel-bg);
    backdrop-filter: blur(12px);
    border: 1px solid var(--border-color);
    text-align: left;
    max-width: 85%;
    white-space: pre-wrap;
    line-height: 1.6;
    font-size: 0.95rem;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
  }

  .msg.user .bubble {
    background: var(--accent-gradient);
    color: #ffffff;
    border: none;
    font-weight: 600;
    border-bottom-right-radius: 4px;
    box-shadow: 0 4px 20px rgba(255, 71, 87, 0.3);
  }

  .msg.agent .bubble {
    border-bottom-left-radius: 4px;
  }

  .bubble.rich {
    background: transparent;
    border: none;
    padding: 0;
    max-width: 100%;
    white-space: normal;
    box-shadow: none;
  }

  form {
    display: flex;
    gap: 0.75rem;
    padding: 1.1rem 1.5rem;
    border-top: 1px solid var(--border-color);
    background: var(--panel-bg);
    backdrop-filter: blur(20px);
    max-width: 880px;
    width: 100%;
    margin: 0 auto;
    border-radius: 24px 24px 0 0;
    box-shadow: 0 -8px 32px rgba(0, 0, 0, 0.4);
  }

  input {
    flex: 1;
    padding: 0.9rem 1.25rem;
    border: 1px solid var(--border-color);
    border-radius: 16px;
    font-size: 0.95rem;
    font-family: inherit;
    background: rgba(7, 10, 18, 0.75);
    color: #ffffff;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  input:focus {
    border-color: var(--accent-coral);
    box-shadow: 0 0 0 3px rgba(255, 71, 87, 0.25);
  }

  button {
    padding: 0.9rem 1.75rem;
    border: none;
    border-radius: 16px;
    background: var(--accent-gradient);
    color: #fff;
    font-weight: 800;
    font-size: 0.95rem;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 4px 16px rgba(255, 71, 87, 0.35);
  }

  button:hover {
    transform: translateY(-1px) scale(1.02);
    box-shadow: 0 6px 24px rgba(255, 71, 87, 0.5);
  }

  /* --- A2UI component styles --- */
  .a2card {
    border: 1px solid var(--border-color);
    border-radius: 20px;
    padding: 1.35rem;
    background: var(--card-bg);
    backdrop-filter: blur(16px);
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
    max-width: 100%;
    color: var(--text-primary);
    transition: all 0.3s ease;
    border-left: 4px solid var(--accent-coral);
  }

  .a2card:hover {
    background: var(--card-hover);
    border-color: var(--border-glow);
    transform: translateY(-2px);
    box-shadow: 0 12px 36px rgba(255, 71, 87, 0.18);
  }

  .a2card + .a2card, .a2col > .a2card { margin-top: 0.85rem; }
  .a2col { display: flex; flex-direction: column; gap: 0.65rem; }
  .a2row { display: flex; flex-direction: row; gap: 0.85rem; align-items: center; flex-wrap: wrap; }
  .a2row.between { justify-content: space-between; }

  .a2text { margin: 0; line-height: 1.45; color: var(--text-primary); }
  .a2text.a2-h1 { font-size: 1.55rem; font-weight: 900; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .a2text.a2-h2 { font-size: 1.3rem; font-weight: 800; color: #ffffff; letter-spacing: -0.01em; }
  .a2text.a2-h3 { font-size: 1.15rem; font-weight: 700; color: #f1f5f9; }
  .a2text.a2-body { font-size: 0.95rem; color: #cbd5e1; }
  .a2text.a2-caption { font-size: 0.85rem; color: var(--accent-amber); font-weight: 600; background: rgba(255, 165, 2, 0.1); padding: 0.25rem 0.6rem; border-radius: 8px; display: inline-block; width: fit-content; }

  .a2divider { border: none; border-top: 1px solid var(--border-color); margin: 0.6rem 0; width: 100%; }

  .a2img-container {
    overflow: hidden;
    border-radius: 14px;
    margin: 0.4rem 0;
    max-height: 260px;
    position: relative;
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
  }

  .a2img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.5s ease;
  }

  .a2card:hover .a2img {
    transform: scale(1.04);
  }

  .material-symbols-outlined {
    font-family: 'Material Symbols Outlined';
    font-size: 1.2rem;
    vertical-align: middle;
    color: var(--accent-coral);
  }
</style>
</head>
<body>

<header>
  <div class="logo-container">
    <span class="logo-icon">🍕</span>
    <div>
      <div class="logo-text">ScrollToBite</div>
    </div>
  </div>
  <div class="status-badge">
    <div class="pulse-dot"></div>
    <span>Vertex AI Agent Runtime</span>
  </div>
</header>

<div class="quick-pills">
  <div class="pill" onclick="sendQuick('Show my saved spots for Bay Area')">📍 SF Wishlist</div>
  <div class="pill" onclick="sendQuick('What are the top viral spots in Mountain View, CA?')">🍦 Mountain View Trending</div>
  <div class="pill" onclick="sendQuick('Show my wishlist for NYC')">🍕 NYC Wishlist</div>
  <div class="pill" onclick="sendQuick('What are trending viral spots in Los Angeles?')">🌮 LA Trending</div>
  <div class="pill" onclick="sendQuick('Save this link: https://www.instagram.com/p/DbpFXyQBJYe/')">➕ Test IG Link Fetch</div>
</div>

<div id="log"></div>

<form id="form">
  <input id="input" placeholder="Paste a TikTok/Instagram link or ask for food spots..." autocomplete="off" autofocus>
  <button>Send</button>
</form>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function boundStr(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (typeof v === "object" && v.literalString != null) return String(v.literalString);
  return String(v);
}

function iconName(raw) {
  const s = String(raw || "").toLowerCase();
  if (s.includes("star") || s.includes("favorite")) return "star";
  if (s.includes("place") || s.includes("location") || s.includes("pin")) return "location_on";
  if (s.includes("restaurant") || s.includes("food") || s.includes("dining")) return "restaurant";
  if (s.includes("share") || s.includes("link")) return "link";
  return "restaurant";
}

function childIds(spec) {
  if (!spec) return [];
  if (typeof spec.child === "string") return [spec.child];
  if (spec.children && Array.isArray(spec.children.explicitList)) return spec.children.explicitList.filter(x => typeof x === "string");
  return [];
}

function buildNode(id, comps, visited) {
  if (!id || visited.has(id) || !comps[id]) return null;
  visited.add(id);
  const spec = comps[id];
  const type = Object.keys(spec)[0];
  const props = spec[type] || {};

  switch (type) {
    case "Card": {
      const card = el("div", "a2card");
      const child = buildNode(props.child, comps, visited);
      if (child) card.appendChild(child);
      return card;
    }
    case "Column": {
      const col = el("div", "a2col");
      for (const cid of childIds(props)) {
        const c = buildNode(cid, comps, visited);
        if (c) col.appendChild(c);
      }
      return col;
    }
    case "Row": {
      const row = el("div", "a2row");
      for (const cid of childIds(props)) {
        const c = buildNode(cid, comps, visited);
        if (c) row.appendChild(c);
      }
      return row;
    }
    case "Text": {
      const t = el("p", "a2text");
      const hint = String(props.usageHint || "body").toLowerCase();
      if (["h1", "h2", "h3", "h4", "h5", "h6"].includes(hint)) t.classList.add("a2-" + hint);
      else if (hint === "caption") t.classList.add("a2-caption");
      else t.classList.add("a2-body");
      t.textContent = boundStr(props.text);
      return t;
    }
    case "Divider":
      return el("hr", "a2divider");
    case "Image": {
      const src = boundStr(props.url || props.src);
      if (!/^https?:\/\//i.test(src)) return null;
      const wrap = el("div", "a2img-container");
      const img = el("img", "a2img");
      img.src = src;
      img.alt = boundStr(props.alt) || "Food spot photo";
      wrap.appendChild(img);
      return wrap;
    }
    case "Icon": {
      const s = el("span", "material-symbols-outlined");
      s.textContent = iconName(boundStr(props.name) || props.name);
      return s;
    }
    default:
      return null;
  }
}

function renderSurface(messages, container) {
  const comps = {};
  const roots = [];
  for (let m of messages) {
    if (m && m.data && (m.data.beginRendering || m.data.surfaceUpdate)) m = m.data;
    if (m.beginRendering && typeof m.beginRendering.root === "string") roots.push(m.beginRendering.root);
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.id && c.component) comps[c.id] = c.component;
  }
  let rootIds = roots.filter(r => comps[r]);
  if (rootIds.length === 0) {
    const referenced = new Set();
    for (const id in comps) { const spec = comps[id]; childIds(spec[Object.keys(spec)[0]] || {}).forEach(c => referenced.add(c)); }
    rootIds = Object.keys(comps).filter(id => !referenced.has(id));
  }
  let drew = false;
  for (const rid of rootIds) { const node = buildNode(rid, comps, new Set()); if (node) { container.appendChild(node); drew = true; } }
  return drew;
}

function flattenText(messages) {
  const out = [];
  for (let m of messages) {
    if (m && m.data && (m.data.beginRendering || m.data.surfaceUpdate)) m = m.data;
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.component && c.component.Text) out.push(boundStr(c.component.Text.text));
  }
  return out.join("\n").trim();
}

function renderReply(b, parts) {
  b.textContent = "";
  const texts = parts.filter(p => p && (p.kind === "text" || (!p.kind && p.text))).map(p => p.text || "");
  const a2ui = parts.filter(p => p && p.kind === "a2ui" && p.data).map(p => p.data);

  const textStr = texts.join("\n").trim();
  if (textStr) b.appendChild(el("div", null, textStr));

  if (a2ui.length) {
    b.classList.add("rich");
    if (!renderSurface(a2ui, b)) b.appendChild(el("div", null, flattenText(a2ui) || "(no card content)"));
  }
}

function appendUserMsg(text) {
  const wrap = el("div", "msg user");
  wrap.appendChild(el("div", "avatar-label", "YOU"));
  const b = el("div", "bubble", text);
  wrap.appendChild(b);
  log.appendChild(wrap);
  log.scrollTop = log.scrollHeight;
}

function appendAgentBubble() {
  const wrap = el("div", "msg agent");
  wrap.appendChild(el("div", "avatar-label", "🤖 SCROLLTOBITE CONCIERGE"));
  const b = el("div", "bubble", "Thinking...");
  wrap.appendChild(b);
  log.appendChild(wrap);
  log.scrollTop = log.scrollHeight;
  return b;
}

async function sendMessage(text) {
  if (!text.trim()) return;
  appendUserMsg(text);
  const bubble = appendAgentBubble();

  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text }),
    });
    if (!res.ok) throw new Error("Server returned HTTP " + res.status);
    const data = await res.json();
    renderReply(bubble, data.parts || []);
  } catch (err) {
    bubble.textContent = "Error: " + err.message;
  }
  log.scrollTop = log.scrollHeight;
}

function sendQuick(txt) {
  input.value = txt;
  form.dispatchEvent(new Event("submit"));
}

form.addEventListener("submit", (e) => {
  e.preventDefault();
  const v = input.value;
  input.value = "";
  sendMessage(v);
});

// Welcome message on launch
window.addEventListener("DOMContentLoaded", () => {
  const welcomeBubble = appendAgentBubble();
  welcomeBubble.innerHTML = "<strong>Hey Foodie! 👋 Welcome to ScrollToBite.</strong><br><br>I can parse shared TikTok/Instagram links to extract restaurant details, show your saved wishlist spots across SF, LA, and NYC, or recommend trending viral food in any city!";
});
</script>
</body>
</html>
